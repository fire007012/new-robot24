# ============================================================
# arm_control 节点参数配置
# ============================================================

# ------------------------------------------------------------
# gripper_cmd_node - 夹爪控制节点
# 作用：将 Bool（开/合）或 Float64（速度）指令
#       转换为 std_msgs/Float64 发送给速度型夹爪控制器
# ------------------------------------------------------------
gripper_cmd_node:
  # 速度控制话题（std_msgs/Float64），单位 rad/s
  velocity_topic: /arm_control/gripper_velocity

  # 一键开/合话题（std_msgs/Bool）：true=开爪，false=合爪
  open_close_topic: /arm_control/gripper_open

  # 发布给夹爪控制器的话题（std_msgs/Float64）
  output_topic: /gripper_controller/command

  # Bool=true/false 时映射的速度（rad/s）
  open_velocity: 0.8
  close_velocity: -0.8

  # Bool 命令保持时长；到时自动补发 0 速，避免一直转
  command_hold_sec: 0.2

  # <=0 表示不额外限幅，保持原始速度语义直通
  max_abs_velocity: 0.0


# ------------------------------------------------------------
# servo_twist_frame_bridge_node - optical frame -> control frame
# 作用：把视觉链路里以 optical frame 发布的 TwistStamped
#       转换为 MoveIt Servo 使用的控制坐标系
# ------------------------------------------------------------
servo_twist_frame_bridge_node:
  # 视觉链建议把 optical frame 下的 Twist 发布到这个输入话题
  input_topic: /arm_control/delta_twist_cmds_optical

  # 转换后的输出话题，直接送到 MoveIt Servo
  output_topic: /servo_server/delta_twist_cmds

  # MoveIt Servo 当前使用的控制坐标系
  target_frame: grasp_tcp

  # 默认 optical frame
  expected_source_frame: catch_camera_optical_frame

  # TF 查询超时（s）
  transform_timeout: 0.05

  # 收到非期望 source frame 时是否直接丢弃
  drop_unexpected_source_frame: true
