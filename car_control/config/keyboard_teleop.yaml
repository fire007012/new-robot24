keyboard_teleop_node:
  raw_state_topic: /car_control/keyboard_teleop/raw_state
  status_topic: /car_control/keyboard_teleop/status
  publish_rate: 30.0
  input_timeout: 0.3

  chassis_cmd_topic: /cmd_vel
  servo_cmd_topic: /servo_server/delta_twist_cmds
  servo_command_frame_param: /servo_server/robot_link_command_frame
  servo_frame: grasp_tcp

  gripper_velocity_topic: /arm_control/gripper_velocity
  default_speed_level: 2
  gripper_rate_level_1: 0.4
  gripper_rate_level_2: 0.6
  gripper_rate_level_3: 0.8
  gripper_rate_level_4: 1.0
  gripper_rate_level_5: 1.2

  flipper_jog_topic: /flipper_control/jog_cmd
  flipper_profile_service: /flipper_control/set_control_profile
  flipper_target_profile: csv_velocity
  flipper_profile_retry_sec: 2.0
  flipper_joint_names:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
  flipper_velocity_level_1: 0.2
  flipper_velocity_level_2: 0.4
  flipper_velocity_level_3: 0.55
  flipper_velocity_level_4: 0.7
  flipper_velocity_level_5: 0.8
  flipper_jog_duration: 0.15

  base_linear_level_1: 0.2
  base_linear_level_2: 0.4
  base_linear_level_3: 0.55
  base_linear_level_4: 0.7
  base_linear_level_5: 0.8
  base_angular_level_1: 0.4
  base_angular_level_2: 0.8
  base_angular_level_3: 1.0
  base_angular_level_4: 1.25
  base_angular_level_5: 1.5

  arm_linear_level_1: 0.04
  arm_linear_level_2: 0.08
  arm_linear_level_3: 0.10
  arm_linear_level_4: 0.125
  arm_linear_level_5: 0.15
  arm_angular_level_1: 0.2
  arm_angular_level_2: 0.4
  arm_angular_level_3: 0.55
  arm_angular_level_4: 0.7
  arm_angular_level_5: 0.8

keyboard_teleop_gui:
  raw_state_topic: /car_control/keyboard_teleop/raw_state
  status_topic: /car_control/keyboard_teleop/status
  publish_rate: 30.0
  window_title: Robot24 Keyboard Teleop
