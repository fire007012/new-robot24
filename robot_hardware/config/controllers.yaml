controller_manager:
  ros__parameters:
    update_rate: 200
    hardware_components_initial_state:
      unconfigured:
      - RobotCanopenSystem
      - CanDriverSystem
    joint_state_broadcaster:
      type: robot_hardware/RetainedJointStateBroadcaster
    arm_position_controller:
      type: robot_hardware/RetainedJointTrajectoryController
    flipper_csp_controller:
      type: robot_hardware/RetainedJointTrajectoryController
    flipper_csv_forward_controller:
      type: robot_hardware/TimedVelocityController
    gripper_controller:
      type: robot_hardware/TimedVelocityController
    wheel_controller:
      type: robot_hardware/SessionDiffDriveController
    arm_servo_controller:
      type: robot_hardware/TimedVelocityController
joint_state_broadcaster:
  ros__parameters: {}
arm_position_controller:
  ros__parameters:
    joints:
    - shoulder_yaw_joint
    - shoulder_pitch_joint
    - elbow_pitch_joint
    - wrist_pitch_joint
    - wrist_yaw_joint
    - wrist_roll_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
flipper_csp_controller:
  ros__parameters:
    joints:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
flipper_csv_forward_controller:
  ros__parameters:
    joints:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
    interface_name: velocity
    command_timeout: 0.25
    lower:
    - -3.665
    - -3.665
    - -0.524
    - -0.524
    upper:
    - 0.524
    - 0.524
    - 3.665
    - 3.665
    max_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
gripper_controller:
  ros__parameters:
    joints:
    - left_gripper_finger_joint
    interface_name: position
    command_timeout: 0.25
    lower:
    - -0.05
    upper:
    - 0.071
    max_velocity:
    - 0.02
wheel_controller:
  ros__parameters:
    left_wheel_names:
    - left_front_wheel_joint
    right_wheel_names:
    - right_front_wheel_joint
    wheel_separation: 0.36
    wheel_radius: 0.075
    cmd_vel_timeout: 0.3
    use_stamped_vel: false
    enable_odom_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
arm_servo_controller:
  ros__parameters:
    joints:
    - shoulder_yaw_joint
    - shoulder_pitch_joint
    - elbow_pitch_joint
    - wrist_pitch_joint
    - wrist_yaw_joint
    - wrist_roll_joint
    interface_name: position
    command_timeout: 0.15
    lower:
    - -1.0
    - -0.96
    - -1.0
    - -1.57
    - -2.356
    - -7.069
    upper:
    - 1.0
    - 1.571
    - 3.05
    - 2.356
    - 2.356
    - 7.069
    max_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
