arm_position_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_yaw_joint
    - shoulder_pitch_joint
    - elbow_pitch_joint
    - wrist_pitch_joint
    - wrist_yaw_joint
    - wrist_roll_joint
  gains:
    shoulder_yaw_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    shoulder_pitch_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    elbow_pitch_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    wrist_pitch_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    wrist_roll_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    wrist_yaw_joint:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
  constraints:
    # Gazebo often converges slightly slower than the idealized MoveIt
    # trajectory timing, so keep the arm JTC from aborting on tiny residuals.
    goal_time: 3.0
    stopped_velocity_tolerance: 0.1
    shoulder_yaw_joint:
      trajectory: 0.05
      goal: 0.01
    shoulder_pitch_joint:
      trajectory: 0.05
      goal: 0.01
    elbow_pitch_joint:
      trajectory: 0.05
      goal: 0.01
    wrist_pitch_joint:
      trajectory: 0.05
      goal: 0.01
    wrist_roll_joint:
      trajectory: 0.05
      goal: 0.01
    wrist_yaw_joint:
      trajectory: 0.05
      goal: 0.01
  state_publish_rate: 50
  action_monitor_rate: 20

flipper_csp_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
  allow_partial_joints_goal: true
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.05
    left_front_arm_joint:
      trajectory: 0.05
      goal: 0.02
    right_front_arm_joint:
      trajectory: 0.05
      goal: 0.02
    left_rear_arm_joint:
      trajectory: 0.05
      goal: 0.02
    right_rear_arm_joint:
      trajectory: 0.05
      goal: 0.02
  state_publish_rate: 50
  action_monitor_rate: 20

flipper_csv_controller:
  type: velocity_controllers/JointTrajectoryController
  joints:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
  allow_partial_joints_goal: true
  gains:
    left_front_arm_joint: {p: 2.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    right_front_arm_joint: {p: 2.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    left_rear_arm_joint: {p: 2.0, i: 0.0, d: 0.0, i_clamp: 0.0}
    right_rear_arm_joint: {p: 2.0, i: 0.0, d: 0.0, i_clamp: 0.0}
  velocity_ff:
    left_front_arm_joint: 1.0
    right_front_arm_joint: 1.0
    left_rear_arm_joint: 1.0
    right_rear_arm_joint: 1.0
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.05
    left_front_arm_joint:
      trajectory: 0.20
      goal: 0.05
    right_front_arm_joint:
      trajectory: 0.20
      goal: 0.05
    left_rear_arm_joint:
      trajectory: 0.20
      goal: 0.05
    right_rear_arm_joint:
      trajectory: 0.20
      goal: 0.05
  stop_trajectory_duration: 0.1
  state_publish_rate: 50
  action_monitor_rate: 20

flipper_csv_forward_controller:
  type: flipper_control/JointGroupVelocityController
  joints:
    - left_front_arm_joint
    - right_front_arm_joint
    - left_rear_arm_joint
    - right_rear_arm_joint
  command_timeout: 0.25

gripper_controller:
  type: velocity_controllers/JointVelocityController
  joint: left_gripper_finger_joint
  pid: {p: 100, d: 1, i: 1, i_clamp: 1}
