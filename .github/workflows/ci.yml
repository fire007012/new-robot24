name: ROS2 Humble core

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Install Humble dependencies
        shell: bash
        run: bash tools/install_ros2_dependencies.sh

      - name: Build and validate core
        shell: bash
        run: bash tools/validate_ros2.sh /tmp/robot24-ci core
